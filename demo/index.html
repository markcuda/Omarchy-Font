<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tinker with Omarchy Font in your browser.">
  <title>Omarchy Font — Tinker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">OMARCHY FONT / PLAYGROUND</p>
      <h1>Make some beautiful noise.</h1>
      <p class="intro">Type anything. See it in the block-built display face. Download the font when you’re ready to take it with you.</p>
    </header>

    <section class="playground" aria-label="Font playground">
      <div class="toolbar">
        <label>Text <textarea id="text" rows="3">OMARCHY</textarea></label>
        <div class="controls">
          <label for="size">Size <output id="sizeValue">72px</output><input id="size" type="range" min="28" max="160" value="72"></label>
          <label for="spacing">Spacing <output id="spacingValue">0px</output><input id="spacing" type="range" min="-4" max="12" value="0"></label>
          <label for="leading">Line height <output id="leadingValue">1.05</output><input id="leading" type="range" min="0.8" max="1.5" value="1.05" step="0.05"></label>
        </div>
      </div>
      <div class="stage" id="stage"><div id="preview" spellcheck="false">OMARCHY</div></div>
      <div class="actions"><button id="copy" type="button">Copy text</button><a class="download" href="Omarchy Font.ttf" download>Download TTF ↗</a></div>
    </section>

    <footer><span>Free to tinker with.</span><a href="../">View the font repo ↗</a></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
